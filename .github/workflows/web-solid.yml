name: Web Solid CI

on:
  push:
    branches: [main]
    paths:
      - "packages/web-solid/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".mise/locks/**"
      - ".github/workflows/web-solid.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/web-solid/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".mise/locks/**"
      - ".github/workflows/web-solid.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-solid-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install dependencies
        run: mise run setup:node

      - name: Check and build
        run: mise run web:ci
