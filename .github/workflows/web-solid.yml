name: Web Solid CI

on:
  push:
    branches: [main]
    paths:
      - "packages/web-solid/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-solid.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/web-solid/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-solid.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-solid-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check
        working-directory: packages/web-solid

      - name: Build
        run: pnpm run build
        working-directory: packages/web-solid
