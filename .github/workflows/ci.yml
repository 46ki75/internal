name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, formatting, and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install dependencies and native Rust components
        run: mise run setup

      - uses: Swatinem/rust-cache@v2

      - name: Run the repository-wide check
        run: mise run check

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install native Rust toolchain
        run: mise run setup:rust

      - uses: Swatinem/rust-cache@v2

      - name: Hermetic Rust tests
        run: mise run rust:test

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install Node dependencies
        run: mise run setup:node

      - name: Frontend tests
        run: mise run web:test

      - name: Production frontend build
        run: mise run web:build

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install Python dependencies
        run: mise run setup:python

      - name: Hermetic Python tests
        run: mise run ag-ui-server:test

  required:
    name: Required checks
    needs: [check, rust-test, web, python]
    # Run even after failures; skipped or canceled dependencies must not pass the gate.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"

  # Coverage is report-only and is deliberately outside the required aggregate.
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install native Rust toolchain and LLVM tools
        run: mise run setup:rust

      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: mise run rust:coverage:ci

      - name: Write coverage summary
        run: |
          {
            echo '### Coverage (hermetic tests)'
            echo '```'
            mise run --quiet rust:coverage:summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov.info
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
