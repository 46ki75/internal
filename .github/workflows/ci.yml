name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Fast static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          version: "2026.9.9"

      - name: Install dependencies and native Rust components
        run: mise run setup

      - uses: Swatinem/rust-cache@v2

      - name: Run the quick repository-wide check
        run: mise run check:quick

  rust-test:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          version: "2026.9.9"

      - name: Install native Rust toolchain
        run: mise run setup:rust

      - uses: Swatinem/rust-cache@v2

      - name: Rust quality gate
        run: mise run //crates:check

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          version: "2026.9.9"

      - name: Install Node dependencies
        run: mise run setup:node

      - name: Frontend quality gate
        run: mise run //packages/web-solid:check

  nitro:
    name: Nitro tests and Lambda build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: "2026.9.9"
      - name: Install Node dependencies
        run: mise run setup:node
      - name: Nitro API quality gate
        run: mise run //packages/http-api:check

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          version: "2026.9.9"

      - name: Install Python dependencies
        run: mise run setup:python

      - name: Python quality gate
        run: mise run //python:check

  required:
    name: Required checks
    needs: [check, rust-test, web, nitro, python]
    # Run even after failures; skipped or canceled dependencies must not pass the gate.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"

  # Coverage is report-only and is deliberately outside the required aggregate.
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          version: "2026.9.9"

      - name: Install native Rust toolchain and LLVM tools
        run: mise run setup:rust

      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: mise run //crates:coverage:ci

      - name: Write coverage summary
        run: |
          {
            echo '### Coverage (hermetic tests)'
            echo '```'
            mise run --quiet //crates:coverage:summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov.info
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
