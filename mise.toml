min_version = "2026.9.9"
monorepo_root = true

[monorepo]
config_roots = ["crates", "packages/*", "python"]
lockfile = true

[tools]
node = "24.21.0"
python = "3.12.14"
uv = "0.12.15"
terraform = "1.16.2"
awscli = "2.36.46"
zig = "0.16.0"
# Linux autodetection also matches Python wheels; select standalone CLI archives.
cargo-lambda = { version = "1.9.2", matching = "cargo-lambda-v" }
cargo-llvm-cov = "0.9.1"

[tool_alias]
cargo-lambda = "github:cargo-lambda/cargo-lambda"
cargo-llvm-cov = "github:taiki-e/cargo-llvm-cov"

[tool_config]
locked = true

[task_config]
shell = "bash -euo pipefail -c"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
UV_PYTHON_DOWNLOADS = "never"

[settings]
idiomatic_version_file_enable_tools = ["pnpm"]
# Rust belongs to rustup; package.json owns pnpm, including its checksum.
disable_tools = ["rust", "npm:pnpm"]
auto_install = false
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tasks.setup]
description = "Prepare Rust, locked Node/Python dependencies, and Git hooks"
depends = [":setup:rust", ":setup:node", ":setup:python"]

[tasks."setup:rust"]
description = "Install the toolchain, components, and targets from rust-toolchain.toml"
run = "rustup toolchain install --no-self-update"

[tasks."setup:node"]
description = "Install locked pnpm workspace dependencies and Git hooks"
run = "pnpm install --frozen-lockfile"

[tasks."setup:python"]
description = "Sync every Python workspace package and dependency group"
run = "uv sync --locked --all-packages --all-groups"

[tasks.fmt]
description = "Format tracked files; accepts repeated --file arguments"
raw_args = true
run = "pnpm exec lefthook run fmt --no-auto-install"

[tasks.fmt-check]
description = "Check the same file scope as fmt"
raw_args = true
run = "pnpm exec lefthook run fmt-check --no-auto-install"

[tasks.lint]
description = "Lint tracked files; accepts repeated --file arguments"
raw_args = true
run = "pnpm exec lefthook run lint --no-auto-install"

[tasks."check:quick"]
description = "Run the fast repository-wide static validation gate"
run = "pnpm exec lefthook run check-quick --no-auto-install"

[tasks."check:repository"]
description = "Check root-owned Markdown and Terraform files"
run = "pnpm exec lefthook run check-repository --all-files --no-auto-install"

[tasks.check]
description = "Run the complete project-wide quality gate required by CI"
depends = [":check:repository", "//...:check"]

[tasks.test]
description = "Run all ordinary hermetic test suites"
depends = ["//...:test"]
