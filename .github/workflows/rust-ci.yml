name: Rust CI

# Hermetic PR gate: formatting, clippy (-D warnings), and the hermetic test
# tier. Live tests are `#[ignore]`'d and run only via rust-live.yml.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "mise.lock"
      - ".mise/locks/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "mise.lock"
      - ".mise/locks/**"
      - ".github/workflows/rust-ci.yml"

# Cancel superseded runs on the same ref.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting only: no workspace compile, so this fails fast (seconds).
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install native Rust toolchain
        run: mise run setup:rust

      - name: Check Rust formatting
        run: mise run rust:fmt-check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install native Rust toolchain
        run: mise run setup:rust

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: mise run rust:lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install native Rust toolchain
        run: mise run setup:rust

      - uses: Swatinem/rust-cache@v2

      - name: Hermetic Rust tests
        run: mise run rust:test

  # Report-only: surfaces hermetic-test coverage but never gates the merge
  # (coverage is a guardrail, not a target).
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"

      - name: Install native Rust toolchain and LLVM tools
        run: mise run setup:rust

      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: mise run rust:coverage:ci

      - name: Write coverage summary
        run: |
          {
            echo '### Coverage (hermetic tests)'
            echo '```'
            mise run --quiet rust:coverage:summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov.info
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

      # Activates once CODECOV_TOKEN is set in repo secrets; until then it
      # no-ops without failing the job (fail_ci_if_error: false).
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
