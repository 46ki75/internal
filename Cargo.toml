[workspace]
members = ["crates/*"]
resolver = "3"

# Package fields shared by every crate; each crate opts in with
# `edition.workspace = true`. Keeps the edition unified across the workspace.
[workspace.package]
edition = "2024"

# Versions shared by 2+ crates live here; each crate opts in with
# `foo.workspace = true` and layers on its own crate-local features.
[workspace.dependencies]
async-trait = "0.1.89"
aws-config = "1.8.14"
# The SDK's `rustls` default enables the vulnerable legacy Rustls 0.21 connector.
# Keep the modern HTTPS client (Rustls 0.23) and Tokio without that legacy feature.
aws-sdk-cloudwatch = { version = "=1.118.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cognitoidentityprovider = { version = "1.109.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.105.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.95.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.104.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = "0.8.8"
cached = { version = "4.0.0", features = ["async"] }
chrono = "0.4.43"
futures = "0.3.31"
http = "1.4.0"
lambda_runtime = "1.0.1"
regex = "1.12.3"
reqwest = { version = "0.13", features = [
    "rustls",
    "http2",
    "gzip",
    "brotli",
], default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = "1.49.0"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["ansi", "env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["time"] }
utoipa-axum = "0.3.0"
uuid = "1.20.0"

# Lints applied uniformly across the workspace; each crate opts in with
# `[lints] workspace = true`.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }
